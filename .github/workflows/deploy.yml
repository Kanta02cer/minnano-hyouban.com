name: Verify GitHub Pages branch snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build public allowlist
        run: npm run build

      - name: Verify main root matches the public build
        run: node scripts/stage-branch-root.js --check
