  <script>
    // Google クローラー向け：DOMContentLoaded を待たずに title/meta/JSON-LD を同期設定
    (function() {
      var params = new URLSearchParams(location.search);
      var slug = (params.get('id') || '').trim();
      if (!slug || !Array.isArray(window.ARTICLES)) return;
      var art = window.ARTICLES.find(function(a) { return a.slug === slug; });
      if (!art) return;

      var baseUrl = 'https://minnano-hyouban.com';
      var articleUrl = baseUrl + '/articles/' + encodeURIComponent(slug) + '/';

      // --- meta / OGP 更新 ---
      var t = art.title || (art.company + 'の評判・口コミ｜みんなの評判.com');
      document.title = t;
      // Citation meta tags（学術引用・AI引用向け）
      var metaMap = {
        'citation_title':       t,
        'citation_author':      '漆沢 祐樹',
        'citation_publisher':   'みんなの評判.com',
        'citation_public_url':  articleUrl,
        'citation_language':    'ja'
      };
      if (art.publishedAt) metaMap['citation_date'] = art.publishedAt;
      Object.entries(metaMap).forEach(function(entry) {
        var name = entry[0], content = entry[1];
        var m = document.querySelector('meta[name="' + name + '"]');
        if (!m) { m = document.createElement('meta'); m.name = name; document.head.appendChild(m); }
        m.content = content;
      });
      var desc = document.querySelector('meta[name="description"]');
      if (desc && art.metaDesc) desc.setAttribute('content', art.metaDesc);
      var ogTitle = document.querySelector('meta[property="og:title"]');
      if (ogTitle) ogTitle.setAttribute('content', t);
      var ogDesc = document.querySelector('meta[property="og:description"]');
      if (ogDesc && art.metaDesc) ogDesc.setAttribute('content', art.metaDesc);
      var ogImage = document.querySelector('meta[property="og:image"]');
      if (ogImage && art.ogImage) ogImage.setAttribute('content', baseUrl + '/' + art.ogImage);
      var ogUrl = document.querySelector('meta[property="og:url"]');
      if (ogUrl) ogUrl.setAttribute('content', articleUrl);
      var twTitle = document.querySelector('meta[name="twitter:title"]');
      if (twTitle) twTitle.setAttribute('content', t);
      var twDesc = document.querySelector('meta[name="twitter:description"]');
      if (twDesc && art.metaDesc) twDesc.setAttribute('content', art.metaDesc);
      var twImage = document.querySelector('meta[name="twitter:image"]');
      if (twImage && art.ogImage) twImage.setAttribute('content', baseUrl + '/' + art.ogImage);
      var canonical = document.querySelector('link[rel="canonical"]');
      if (canonical) canonical.setAttribute('href', articleUrl);

      // --- 平均レーティング計算 ---
      var avgRating = null, ratingCount = 0;
      if (art.reviews && art.reviews.length) {
        var sum = art.reviews.reduce(function(acc, r) { return acc + (r.stars || 0); }, 0);
        avgRating = Math.round(sum / art.reviews.length * 10) / 10;
        ratingCount = art.reviews.length;
      }

      // --- 動的 JSON-LD 生成 ---
      var schemas = [];

      // BreadcrumbList（記事固有タイトル入り）
      schemas.push({
        '@context': 'https://schema.org',
        '@type': 'BreadcrumbList',
        'itemListElement': [
          { '@type': 'ListItem', 'position': 1, 'name': 'トップ', 'item': baseUrl + '/' },
          { '@type': 'ListItem', 'position': 2, 'name': '記事一覧', 'item': baseUrl + '/articles.html' },
          { '@type': 'ListItem', 'position': 3, 'name': art.company || t, 'item': articleUrl }
        ]
      });

      if (art.schemaType === 'Product') {
        // Product スキーマ
        var product = {
          '@context': 'https://schema.org',
          '@type': 'Product',
          'name': art.brand || art.company,
          'description': art.summary || art.metaDesc || '',
          'url': articleUrl,
          'brand': { '@type': 'Brand', 'name': art.brand || art.company }
        };
        if (art.manufacturer) product.manufacturer = { '@type': 'Organization', 'name': art.manufacturer };
        if (art.heroImg) product.image = baseUrl + '/' + art.heroImg;
        if (art.sameAs && art.sameAs.length) product.sameAs = art.sameAs;
        if (avgRating !== null) {
          product.aggregateRating = {
            '@type': 'AggregateRating',
            'ratingValue': String(avgRating),
            'reviewCount': String(ratingCount),
            'bestRating': '5',
            'worstRating': '1'
          };
        }
        if (art.priceInfo) {
          product.offers = {
            '@type': 'Offer',
            'price': art.priceInfo.value,
            'priceCurrency': art.priceInfo.currency || 'JPY',
            'url': art.priceInfo.url || articleUrl,
            'availability': 'https://schema.org/InStock'
          };
          if (art.priceInfo.description) product.offers.description = art.priceInfo.description;
        }
        schemas.push(product);

      } else {
        // NewsArticle スキーマ
        var article = {
          '@context': 'https://schema.org',
          '@type': 'NewsArticle',
          'headline': t,
          'description': art.metaDesc || art.summary || '',
          'url': articleUrl,
          'datePublished': art.publishedAt || '',
          'dateModified': art.updatedAt || art.publishedAt || '',
          'inLanguage': 'ja-JP',
          'isAccessibleForFree': true,
          'author': {
            '@type': 'Person',
            '@id': baseUrl + '/#person-urushizawa',
            'name': '漆沢 祐樹'
          },
          'publisher': {
            '@type': 'Organization',
            '@id': baseUrl + '/#organization',
            'name': 'みんなの評判.com',
            'logo': { '@type': 'ImageObject', 'url': baseUrl + '/favicon.png', 'width': 512, 'height': 512 }
          }
        };
        if (art.heroImg) article.image = baseUrl + '/' + art.heroImg;
        if (avgRating !== null) {
          article.aggregateRating = {
            '@type': 'AggregateRating',
            'ratingValue': String(avgRating),
            'reviewCount': String(ratingCount),
            'bestRating': '5',
            'worstRating': '1'
          };
        }
        schemas.push(article);
      }

      // FAQPage スキーマ（art.faqs が存在する場合に追加）
      var faqItems = (art.faqs || []).concat(art.relatedQA || []);
      if (faqItems.length > 0) {
        schemas.push({
          '@context': 'https://schema.org',
          '@type': 'FAQPage',
          'mainEntity': faqItems.map(function(item) {
            return {
              '@type': 'Question',
              'name': item.q,
              'acceptedAnswer': {
                '@type': 'Answer',
                'text': item.a
              }
            };
          })
        });
      }

      // Speakable スキーマ（AIアシスタント・音声検索向け）
      if (art.summary) {
        schemas.push({
          '@context': 'https://schema.org',
          '@type': 'WebPage',
          'url': articleUrl,
          'speakable': {
            '@type': 'SpeakableSpecification',
            'cssSelector': ['.hero-summary', '.summary-section', '.article-summary', 'h1', '.hero-title']
          },
          'name': t,
          'description': art.summary.slice(0, 300)
        });
      }

      // --- head へ注入 ---
      schemas.forEach(function(schema) {
        var s = document.createElement('script');
        s.type = 'application/ld+json';
        s.textContent = JSON.stringify(schema);
        document.head.appendChild(s);
      });
    })();
  </script>
